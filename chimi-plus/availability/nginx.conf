server {
  listen 80;
  server_name _;
  location = /_chimi/catalog-data {
    limit_except GET { deny all; }
    proxy_pass http://192.168.3.41:8769/catalog;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 2s;
    proxy_read_timeout 32s;
  }
  location = /_chimi/availability {
    limit_except GET { deny all; }
    proxy_pass http://192.168.3.41:8769/availability;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 2s;
    proxy_read_timeout 25s;
  }
  location = /_chimi/availability.js {
    alias /etc/nginx/chimi/availability.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }
  location = /_chimi/ptbr.js {
    alias /etc/nginx/chimi/ptbr.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }
  location = /_chimi/asc {
    alias /etc/nginx/chimi/asc.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
  }
  location = /_chimi/asc.js {
    alias /etc/nginx/chimi/asc.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }
  location = /_chimi/asc-nav.js {
    alias /etc/nginx/chimi/asc-nav.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
  }
  location / {
    proxy_pass http://jellyseerr:5055;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' '<script defer src="/_chimi/availability.js"></script><script defer src="/_chimi/ptbr.js"></script><script defer src="/_chimi/asc-nav.js"></script></body>';
    proxy_read_timeout 120s;
  }
}
